name: Release macOS, Windows and NAS
'on':
  workflow_dispatch: null
  push:
    branches:
      - main
      - feat/**
    tags:
      - v*.*.*
  pull_request: null
permissions:
  contents: write
  # 发版后要开 dev -> main 的清单 PR（main 有「要求 PR」的保护，bot 推不上去）
  pull-requests: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Classify website-only update
    runs-on: ubuntu-latest
    outputs:
      website_only: ${{ steps.scope.outputs.website_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Detect website-only changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |-
          node <<'NODE'
          const {execFileSync}=require('node:child_process');
          const fs=require('node:fs');
          const {EVENT_NAME,REF,BASE_SHA,HEAD_SHA,GITHUB_OUTPUT}=process.env;
          let websiteOnly=false;
          if (EVENT_NAME!=='workflow_dispatch' && !REF.startsWith('refs/tags/') && /^[a-f0-9]{40}$/.test(BASE_SHA||'') && !/^0+$/.test(BASE_SHA)) {
            const files=execFileSync('git',['diff','--name-only','-z',BASE_SHA,HEAD_SHA],{encoding:'utf8'}).split(String.fromCharCode(0)).filter(Boolean);
            const workflowPaths=new Set(['.github/workflows/release-dmg.yml','.github/workflows/pages.yml']);
            websiteOnly=files.some(file=>file.startsWith('website/')) && files.every(file=>file.startsWith('website/')||workflowPaths.has(file));
            console.log('Changed files:',files.length);
          }
          fs.appendFileSync(GITHUB_OUTPUT,'website_only='+websiteOnly+String.fromCharCode(10));
          console.log('Website-only update:',websiteOnly);
          NODE
  tag:
    # main 驱动：合并到 main 后，若 package.json 的版本还没有对应 tag，就打一个。
    # 真正的构建与发布由这次 tag push 触发（on.push.tags），所以 main 上不重复构建。
    name: Tag version on main
    needs:
      - changes
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.website_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create vX.Y.Z tag when this version has none
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::notice::${TAG} 已存在，本次不重复发版"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG}" -m "Pome Panel ${TAG}"
          git push origin "${TAG}"
          echo "::notice::已创建 ${TAG}，由它触发三平台构建与发布"

  mac:
    name: Build Apple Silicon DMG
    runs-on: macos-14
    if: github.ref_type == 'tag' || github.event_name == 'pull_request'
    # macOS arm64 的 hosted runner 容量紧张，抢不到机器时 GitHub 会连续重试约 15 分钟再放弃。
    # 原来 45 分钟的超时里大半耗在排队，把上限抬高让它能等到机器。真正的失败仍由重试
    # workflow（retry-release.yml）兜底。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ needs.changes.outputs.website_only == 'true' && 'website/package-lock.json' || 'package-lock.json' }}
      - name: Validate website without building installers
        if: needs.changes.outputs.website_only == 'true'
        working-directory: website
        shell: bash
        run: |-
          npm ci --no-audit --no-fund
          npm run i18n:check
          npm run test:i18n
          npm run build
          npm test
      - run: node scripts/release-policy.js
        if: needs.changes.outputs.website_only != 'true'
      - run: npm ci
        if: needs.changes.outputs.website_only != 'true'
      - run: npm test
        env:
          # CI runner 没有真实桌面尺寸（Windows 只有 1024x768），tests/*.electron.js 那批
          # 交互验收脚本会因此误报，且它们还要生成人工核对的截图。
          # 单元测试与语法检查照常跑；交互验收在本地或真机执行。
          POME_SKIP_ELECTRON_ACCEPTANCE: '1'
        if: needs.changes.outputs.website_only != 'true'
      - name: Build DMG
        run: npm run build
        if: needs.changes.outputs.website_only != 'true'
      - name: Verify and checksum DMG
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          # P4-0：Mac 不使用 koffi。多余的未签名 Mach-O 会让 ad-hoc 签名与下面的
          # --deep --strict 校验失败，所以先确认 build.mac.files 的排除真的生效了。
          app_modules='dist.noindex/mac-arm64/Pome Panel.app/Contents/Resources/app/node_modules'
          for excluded in koffi @koromix; do
            if [ -e "${app_modules}/${excluded}" ]; then
              echo "Mac build must not ship ${excluded}" >&2
              exit 1
            fi
          done
          codesign --verify --deep --strict 'dist.noindex/mac-arm64/Pome Panel.app'
          hdiutil verify "dist.noindex/Pome-Panel-${version}-arm64.dmg"
          cd dist.noindex
          shasum -a 256 "Pome-Panel-${version}-arm64.dmg" > "Pome-Panel-${version}-arm64.dmg.sha256"
        if: needs.changes.outputs.website_only != 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: |
            dist.noindex/*.dmg
            dist.noindex/*.dmg.sha256
          if-no-files-found: error
        if: needs.changes.outputs.website_only != 'true'
    needs:
      - changes
  windows:
    name: Build and test Windows installer
    runs-on: windows-latest
    if: github.ref_type == 'tag' || github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ needs.changes.outputs.website_only == 'true' && 'website/package-lock.json' || 'package-lock.json' }}
      - name: Validate website without building installers
        if: needs.changes.outputs.website_only == 'true'
        working-directory: website
        shell: bash
        run: |-
          npm ci --no-audit --no-fund
          npm run i18n:check
          npm run test:i18n
          npm run build
          npm test
      - run: node scripts/release-policy.js
        if: needs.changes.outputs.website_only != 'true'
      - run: npm ci
        if: needs.changes.outputs.website_only != 'true'
      - run: npm test
        env:
          # CI runner 没有真实桌面尺寸（Windows 只有 1024x768），tests/*.electron.js 那批
          # 交互验收脚本会因此误报，且它们还要生成人工核对的截图。
          # 单元测试与语法检查照常跑；交互验收在本地或真机执行。
          POME_SKIP_ELECTRON_ACCEPTANCE: '1'
        if: needs.changes.outputs.website_only != 'true'
      - run: npm run build:win
        if: needs.changes.outputs.website_only != 'true'
      - name: Verify installed Windows application
        shell: pwsh
        run: ./scripts/verify-windows.ps1
        if: needs.changes.outputs.website_only != 'true'
      - uses: actions/upload-artifact@v4
        if: (always()) && needs.changes.outputs.website_only != 'true'
        with:
          name: windows-test-evidence
          path: dist.noindex/windows-smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist.noindex/*-setup.exe
            dist.noindex/*-setup.exe.sha256
          if-no-files-found: error
        if: needs.changes.outputs.website_only != 'true'
    needs:
      - changes
  nas:
    name: Build fnOS FPK
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag' || github.event_name == 'pull_request'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate website without building installers
        if: needs.changes.outputs.website_only == 'true'
        working-directory: website
        shell: bash
        run: |-
          npm ci --no-audit --no-fund
          npm run i18n:check
          npm run test:i18n
          npm run build
          npm test
      - run: node scripts/release-policy.js
        if: needs.changes.outputs.website_only != 'true'
      - name: Install NAS test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        if: needs.changes.outputs.website_only != 'true'
      - name: Test NAS server and packaging
        run: >-
          node --test tests/fnos-*.test.js tests/sync-protocol.test.js tests/schema-version.test.js tests/nas-recovery.test.js tests/fpk-build.test.js
          tests/release-policy.test.js
        if: needs.changes.outputs.website_only != 'true'
      - name: Install pinned official fnpack
        shell: bash
        run: |
          set -euo pipefail
          # Official tool: https://developer.fnnas.com/docs/cli/fnpack/
          FNPACK="$RUNNER_TEMP/fnpack"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 --output "$FNPACK"
          printf '%s  %s\n' '54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93' "$FNPACK" | sha256sum --check -
          chmod +x "$FNPACK"
          printf 'FNPACK=%s\n' "$FNPACK" >> "$GITHUB_ENV"
        if: needs.changes.outputs.website_only != 'true'
      - name: Build NAS FPK and checksum
        run: node scripts/build-fpk.js
        if: needs.changes.outputs.website_only != 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: nas-installer
          path: |
            dist.noindex/*-fnos-all.fpk
            dist.noindex/*-fnos-all.fpk.sha256
          if-no-files-found: error
        if: needs.changes.outputs.website_only != 'true'
    needs:
      - changes
  release:
    name: Publish verified installers
    needs:
      - changes
      - mac
      - windows
      - nas
    runs-on: ubuntu-latest
    # 只改官网时不发布；真正发版只在 tag 上（release-policy.js 里 publish 也判 tag）。
    # macOS 构建在 GitHub hosted runner 上经常拿不到机器（1 秒 cancelled、runner_name 为空），
    # 所以它不参与发版门禁：Windows 与 fnOS 必须成功，macOS 产物有就一起发、
    # 没有就跳过并在日志里说明，等能在别处构建出来后手动补传到同一个 Release。
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.windows.result == 'success' &&
      needs.nas.result == 'success' &&
      (github.ref_type == 'tag' || github.event_name == 'pull_request') &&
      needs.changes.outputs.website_only != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve release policy
        id: release
        run: node scripts/release-policy.js
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installer'
          merge-multiple: true
          path: release-assets
      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets

          # 校验已有的校验和（macOS 缺失时这里只剩 exe/fpk）
          shopt -s nullglob
          sha_files=(*.sha256)
          if [ ${#sha_files[@]} -eq 0 ]; then echo '::error::没有任何校验和文件，产物不完整'; exit 1; fi
          sha256sum --check "${sha_files[@]}"
          cd ..

          # 只上传实际存在的资产：macOS 构建拿不到 runner 时就没有 .dmg
          shopt -s nullglob
          assets=(release-assets/*.dmg release-assets/*.exe release-assets/*.fpk release-assets/*.sha256)
          if [ ${#assets[@]} -eq 0 ]; then echo '::error::没有可发布的产物'; exit 1; fi
          has_dmg=0
          for a in "${assets[@]}"; do case "$a" in *.dmg) has_dmg=1;; esac; done
          if [ "$has_dmg" -eq 0 ]; then
            echo '::warning::本次没有 macOS 产物（构建拿不到 runner），Release 只含 Windows 与 fnOS；'
            echo '::warning::macOS 包构建出来后可用 gh release upload '"${GITHUB_REF_NAME}"' 补传。'
          fi
          echo "发布资产：${assets[*]}"

          sed "s/{{VERSION}}/${{ steps.release.outputs.version }}/g" docs/release-notes.md > release-notes.rendered.md
          if grep -q '{{VERSION}}' release-notes.rendered.md; then echo 'release notes placeholder not rendered' >&2; exit 1; fi

          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --title "Pome Panel ${GITHUB_REF_NAME}" \
            --notes-file release-notes.rendered.md
      - name: Checkout dev for the manifest commit
        if: steps.release.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Generate website download manifest and open a pull request
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |-
          node scripts/gen-downloads-json.mjs "$TAG"
          if [ -z "$(git status --porcelain website/public/downloads.json website/public/downloads)" ]; then
            echo '下载清单没有变化，不需要提 PR'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/public/downloads.json website/public/downloads
          git commit -m "chore(website): 更新下载清单 $TAG"
          # main 有「要求 PR」的保护，bot 推不上去，所以走 dev + PR，合并由人点
          git push origin dev
          if gh pr list --base main --head dev --state open --json title -q '.[].title' | grep -qF "更新下载清单 $TAG"; then
            echo '同标题 PR 已存在，跳过'
            exit 0
          fi
          gh pr create --base main --head dev \
            --title "更新下载清单 $TAG" \
            --body "发版流水线生成了官网的下载清单（website/public/downloads.json），指向 $TAG 的安装包。合并后 EdgeOne 自动构建，官网下载弹窗就会列出这个版本的安装包。"
