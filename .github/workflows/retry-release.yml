name: Retry failed release

# macOS arm64 的 hosted runner 偶尔抢不到机器，报
#   "The job was not acquired by Runner of type hosted even after multiple attempts"
# 这是 GitHub 侧容量问题，不是代码问题，重跑一次通常就过了。
# 这里自动重跑失败的 job，最多尝试 3 次，避免因为排队把整个发版卡死。

on:
  workflow_run:
    workflows: ["Release macOS, Windows and NAS"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    name: Re-run failed jobs
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run failed jobs of the failed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          echo "第 ${ATTEMPT} 次尝试失败（分支 ${BRANCH}），重跑失败的 job"
          gh run rerun "$RUN_ID" --failed
