<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pome 工作台改版对照</title><style>*{box-sizing:border-box}body{margin:0;background:#121214;color:#eeeae3;font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1480px;margin:auto;padding:36px}h1{font-size:28px;margin:0}p{color:#b4b0ba;margin:8px 0}.toolbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 0;background:#121214ee;backdrop-filter:blur(12px)}button,a{font:inherit}button{border:1px solid #3b383d;border-radius:999px;background:#222125;color:#ccc6ca;padding:7px 15px;cursor:pointer}button[aria-pressed=true]{color:#222;background:#eee8df;border-color:#eee8df}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;border:1px solid #353137;border-radius:16px;overflow:hidden;background:#1a191c}img{display:block;width:100%;height:auto}figcaption{padding:12px 16px}h2{font-size:16px;margin:0}figcaption p{font-size:13px;margin:3px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:25px}.pair img{border:1px solid #353137;border-radius:12px}.pair label{display:block;color:#b4a8ae;margin:8px 0}footer{color:#96919b;font-size:13px;margin:22px 0}a{color:#dfb7b1}@media(max-width:800px){.grid,.pair{grid-template-columns:1fr}.wrap{padding:20px}}</style><div class="wrap"><h1>Pome 工作台 · 实际界面改版对照</h1><p>2026-10-28 · 当前源码的隔离 Electron 实拍 · 示例内容 · 1240 × 638 CSS 视口、DPR 2</p><div class="toolbar"><button id="after-button" type="button" aria-pressed="true">改后</button><button id="before-button" type="button" aria-pressed="false">改前</button><span>点截图可查看原尺寸</span></div><div class="grid"><figure><a class="shot-link" href="after/02-todo.png" target="_blank"><img data-shot="02-todo.png" src="after/02-todo.png" alt="待办界面截图"></a><figcaption><h2>待办</h2><p>保留分类，轻分隔工作面、未完成统计、顶栏添加分类。</p></figcaption></figure><figure><a class="shot-link" href="after/03-notes.png" target="_blank"><img data-shot="03-notes.png" src="after/03-notes.png" alt="笔记界面截图"></a><figcaption><h2>笔记</h2><p>轻量索引与平静正文，标题去重保留 Markdown 和交互链接。</p></figcaption></figure><figure><a class="shot-link" href="after/04-links.png" target="_blank"><img data-shot="04-links.png" src="after/04-links.png" alt="链接界面截图"></a><figcaption><h2>链接</h2><p>轻分组资料架、清晰域名与统一行内操作。</p></figcaption></figure><figure><a class="shot-link" href="after/05-recordings.png" target="_blank"><img data-shot="05-recordings.png" src="after/05-recordings.png" alt="录制界面截图"></a><figcaption><h2>录制</h2><p>轻索引、同风格真实播放器，支持定位、音量与倍速。</p></figcaption></figure><figure><a class="shot-link" href="after/06-credentials.png" target="_blank"><img data-shot="06-credentials.png" src="after/06-credentials.png" alt="密钥界面截图"></a><figcaption><h2>密钥</h2><p>查询与复制优先，新增表单按需打开。</p></figcaption></figure><figure><a class="shot-link" href="after/07-settings.png" target="_blank"><img data-shot="07-settings.png" src="after/07-settings.png" alt="设置界面截图"></a><figcaption><h2>设置</h2><p>常用入口优先，减轻卡片和多层描边。</p></figcaption></figure></div><div class="pair"><div><label>新增密钥 · 默认遮蔽 / 按需打开</label><a href="credential-create.png"><img src="credential-create.png" alt="新增密钥弹窗"></a></div><div><label>740 × 500 · 德文设置页</label><a href="740x500-settings.png"><img src="740x500-settings.png" alt="窄矮屏设置页"></a></div></div><footer>新交互、长内容、中英德、窄屏与减少动效已经专项验收；完整回归结果见 <a href="README.md">验收说明</a>。Windows、移动真机与完整读屏路径未验收。没有使用真实密钥、麦克风或 NAS。</footer></div><script>for(const mode of ['before','after'])document.getElementById(mode+'-button').addEventListener('click',()=>{for(const m of ['before','after'])document.getElementById(m+'-button').setAttribute('aria-pressed',String(mode===m));for(const img of document.querySelectorAll('[data-shot]')){img.src=mode+'/'+img.dataset.shot;img.parentElement.href=img.src;}});</script></html>
