<style>
.scene { position: relative; overflow: hidden; }
.wall { position: absolute; inset: -60px; filter: blur(26px) saturate(1.05); }
.wall.mac { background:
   radial-gradient(38% 70% at 18% 30%, #3b4a7a 0, transparent 70%),
   radial-gradient(34% 80% at 52% 110%, #c77a5b 0, transparent 70%),
   radial-gradient(40% 90% at 88% 20%, #2f6b72 0, transparent 70%),
   radial-gradient(30% 60% at 70% 80%, #6a4a86 0, transparent 70%),
   linear-gradient(180deg, #1d2236, #2a2433); }
.wall.win { background:
   radial-gradient(40% 90% at 50% 120%, #2f7cf0 0, transparent 70%),
   radial-gradient(30% 70% at 30% 60%, #1b4fb3 0, transparent 70%),
   radial-gradient(35% 80% at 75% 55%, #4a6fd6 0, transparent 70%),
   linear-gradient(180deg, #0c1d3d, #12306a); }
.grain { position: absolute; inset: 0; opacity: .06; mix-blend-mode: overlay;
   background-image: repeating-radial-gradient(circle at 13% 27%, #fff 0 .5px, transparent .5px 2px); }
.menubar { position: absolute; left: 0; right: 0; top: 0; height: 32px; display: flex; align-items: center; justify-content: space-between;
   padding: 0 14px 0 18px; background: rgba(18,18,26,.32); backdrop-filter: blur(24px) saturate(1.4);
   color: rgba(255,255,255,.92); font-size: 13px; font-weight: 500; letter-spacing: -.1px; }
.menubar .l, .menubar .r { display: flex; align-items: center; gap: 18px; }
.menubar .app { font-weight: 700; }
.menubar .logo { width: 13px; height: 13px; border-radius: 4px; background: rgba(255,255,255,.88); }
.menubar svg { height: 14px; display: block; }
.notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 200px; height: 32px; background: #000;
   border-radius: 0 0 10px 10px; }
.notch::before, .notch::after { content: ''; position: absolute; top: 0; width: 6px; height: 6px; }
.notch::before { left: -6px; background: radial-gradient(circle at 0 100%, transparent 5.5px, #000 6px); }
.notch::after { right: -6px; background: radial-gradient(circle at 100% 100%, transparent 5.5px, #000 6px); }
.anchor { position: absolute; top: 0; left: 50%; transform: translateX(-50%); }
.anchor.win { top: 10px; }
.caption { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; display: flex; align-items: center; justify-content: space-between;
   padding: 0 16px; background: #0b0b0c; border-top: 1px solid rgba(255,255,255,.06); color: #8a8a8a; font-size: 11px; font-weight: 500; }
.caption b { color: #e8e8e8; font-weight: 600; margin-right: 8px; }
.caption .tag { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); color: #d0d0d0; font-size: 10px; }
.caption .ph { color: #5f5f5f; }
