<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="copy.pomePanelNotification.437b56">Pome Panel 提醒</title>
    <link rel="stylesheet" href="./notification.css" />
    <link rel="stylesheet" href="./attention-reminder.css" />
  </head>
  <body>
    <main id="notification-root" class="notification-root" aria-live="polite" aria-atomic="true" hidden>
      <div id="notification-shell" class="notification-shell">
        <span class="shoulder left" aria-hidden="true"></span>
        <span class="shoulder right" aria-hidden="true"></span>
        <div class="notification-shape">
          <div class="notification-cap" aria-hidden="true"></div>
          <div class="attention-seam" aria-hidden="true" hidden></div>
          <div id="attention-content" class="attention-content" hidden>
            <div class="attention-header">
              <span class="attention-chip"><i class="attention-dot" aria-hidden="true"></i><span id="attention-label"></span></span>
              <span class="attention-source"><img id="attention-brand" class="attention-brand" alt="" /><span id="attention-source"></span><span id="attention-project" class="attention-project"></span></span>
              <span class="attention-trailing"><time id="attention-time"></time><span id="attention-queue" class="notification-queue" hidden><svg class="attention-pause" viewBox="0 0 8 8" aria-hidden="true"><use href="./assets/notification/glyphs.svg#pause"></use></svg><span id="attention-queue-count"></span></span>
                <button id="attention-close" class="notification-close" type="button" aria-label="隐藏这次提醒" data-i18n-aria-label="attention.hide"><svg viewBox="0 0 10 10" aria-hidden="true"><use href="./assets/notification/glyphs.svg#close"></use></svg></button>
              </span>
            </div>
            <div id="attention-title" class="attention-title"></div>
            <div class="attention-footer"><button id="attention-action" class="attention-action" type="button"><span id="attention-action-label"></span><span class="attention-arrow" aria-hidden="true">↗</span></button><span id="attention-hint" class="attention-hint"></span></div>
          </div>
          <div class="notification-content">
            <span class="notification-icon" aria-hidden="true">
              <span id="notification-brand" class="notification-brand"></span>
              <span id="notification-status" class="notification-status">
                <svg viewBox="0 0 10 10"><use id="notification-status-glyph" href="./assets/notification/glyphs.svg#completed"></use></svg>
              </span>
            </span>
            <div class="notification-copy">
              <span id="notification-title" class="notification-title"></span>
              <span class="notification-trailing">
                <span id="notification-time" class="notification-time"></span>
                <span id="notification-queue" class="notification-queue" hidden></span>
                <button id="notification-close" class="notification-close" type="button" aria-label="关闭任务提醒" data-i18n-aria-label="copy.dismissTaskNotification.30ec6c">
                  <svg viewBox="0 0 10 10" aria-hidden="true"><use href="./assets/notification/glyphs.svg#close"></use></svg>
                </button>
              </span>
              <span class="notification-subtitle">
                <span id="notification-source"></span><span id="notification-separator" class="notification-separator">·</span><span id="notification-detail" class="notification-detail"></span>
              </span>
            </div>
            <div id="notification-progress" class="notification-progress" aria-hidden="true"><i id="notification-progress-fill"></i></div>
          </div>
          <button id="notification-open" class="notification-open" type="button" aria-label="打开任务对应窗口" data-i18n-aria-label="copy.openTheSourceApp.ce1839"></button>
        </div>
      </div>
    </main>
    <script src="../localization/resources.js"></script>
    <script src="../localization/runtime.js"></script>
    <script src="./localization.js"></script>
    <script src="./notification-domain.js" defer></script>
    <script src="./notification.js" defer></script>
  </body>
</html>
