<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pome Panel Sync</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="panel">
    <h1 class="brand">Pome Panel Sync</h1>
    <p class="lead">飞牛 NAS 同步服务（P0 骨架）。完整桌面设置与配对 UI 在 Electron 客户端。</p>
    <dl class="meta">
      <div><dt>Health</dt><dd><code>/api/v1/health</code></dd></div>
      <div><dt>Me</dt><dd><code>/api/v1/me</code>（仅网关会话）</dd></div>
      <div><dt>Auth probe</dt><dd><code>/api/v1/auth-probe</code></dd></div>
    </dl>
    <p class="note">设备同步端口只认 deviceToken，永不信任 <code>X-Trim-*</code>。端口不写死。</p>
  </main>
</body>
</html>
