<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pome Panel Sync — 安装</title>
  <style>
    :root {
      --bg-base: #000000;
      --surface-1: #111111;
      --text-1: #F5F5F5;
      --text-3: #707070;
      --hairline: rgba(255, 255, 255, 0.08);
      --r-tile: 18px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'SF Pro Text', 'PingFang SC', sans-serif;
      --s-4: 16px;
      --s-5: 20px;
    }
    body {
      margin: 0;
      padding: var(--s-5);
      background: var(--bg-base);
      color: var(--text-1);
      font-family: var(--font);
    }
    .card {
      max-width: 36rem;
      padding: var(--s-5);
      border: 1px solid var(--hairline);
      border-radius: var(--r-tile);
      background: var(--surface-1);
    }
    h1 { margin: 0 0 var(--s-4); font-size: 17px; font-weight: 600; }
    p { margin: 0; color: var(--text-3); line-height: 1.5; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Pome Panel Sync</h1>
    <p>安装完成后请从应用中心打开本应用，在已登录会话下生成配对码，再于桌面客户端完成绑定。G0 真机矩阵归档前勿宣称通道可用。</p>
  </div>
</body>
</html>
